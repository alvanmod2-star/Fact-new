<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackers Cloud 2026 | مركز التحميل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon-green: #00ff41; 
            --neon-blue: #00d2ff;
            --bg-black: #050505;
            --card-bg: rgba(15, 15, 15, 0.95);
        }

        body { 
            background: var(--bg-black); 
            color: #fff; 
            font-family: 'Orbitron', sans-serif; /* ستايل جيمنج */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            overflow-x: hidden;
        }

        /* خلفية مشفرة خفيفة */
        body::before {
            content: "010101";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03;
            font-size: 10px;
            word-wrap: break-word;
            z-index: -1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1.5s ease;
        }

        .header h1 {
            font-size: 35px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
            margin-bottom: 5px;
        }

        .files-container { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 600px; 
            border-radius: 5px; 
            padding: 30px; 
            border: 1px solid var(--neon-green); 
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2); 
            position: relative;
        }

        /* زوايا ديكور للواجهة */
        .files-container::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px;
            width: 50px; height: 50px;
            border-top: 3px solid var(--neon-blue);
            border-left: 3px solid var(--neon-blue);
        }

        .file-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px; 
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-right: 4px solid var(--neon-blue);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .file-item:hover { 
            background: rgba(0, 210, 255, 0.1);
            transform: translateX(-10px);
            border-right-color: var(--neon-green);
        }

        .file-name { 
            font-size: 16px;
            font-weight: bold;
            color: #e0e0e0;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* زر التحميل الخرافي */
        .download-btn { 
            position: relative;
            background: transparent;
            color: var(--neon-green);
            text-decoration: none;
            padding: 10px 25px;
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            border: 1px solid var(--neon-green);
            overflow: hidden;
            transition: 0.5s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--neon-green);
            transition: 0.5s;
            z-index: -1;
        }

        .download-btn:hover {
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
        }

        .download-btn:hover::before {
            left: 0;
        }

        /* لودر Hacker Style */
        .hacker-loader {
            text-align: center;
            color: var(--neon-blue);
            font-family: monospace;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .sync-btn {
            background: none; border: 1px solid #333; color: #555;
            padding: 5px 10px; cursor: pointer; border-radius: 3px;
        }
        .sync-btn:hover { color: var(--neon-blue); border-color: var(--neon-blue); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="header">
    <h1><i class="fas fa-terminal"></i> EXPLOIT CLOUD</h1>
    <p style="color: var(--neon-blue); font-size: 12px; letter-spacing: 2px;">SECURE SERVER INJECTION [V2.6]</p>
</div>

<div class="files-container">
    <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
        <span style="color: #555; font-size: 12px;">ROOT@SYSTEM:~# GET_FILES</span>
        <button class="sync-btn" onclick="fetchFiles()"><i class="fas fa-sync"></i> REFRESH</button>
    </div>

    <div id="loader" class="hacker-loader">
        <p>INITIALIZING CONNECTION...</p>
        <p>> ACCESSING DRIVE STORAGE...</p>
    </div>

    <div id="filesList"></div>
</div>

<script>
    // الرابط الخاص بك
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyHXuVR-pmri7H4revJk3fGxZmRKzv3l0ziGPT1TRbl8crOJc8VZ5LDIweT1MARolVN/exec';

    async function fetchFiles() {
        const listDiv = document.getElementById('filesList');
        const loader = document.getElementById('loader');
        
        listDiv.innerHTML = "";
        loader.style.display = "block";

        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            
            if (data.length === 0) {
                listDiv.innerHTML = "<p style='color:#444; text-align:center;'>NO DATA FOUND IN SECTOR_01</p>";
            } else {
                data.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <div class="file-info">
                            <i class="fas fa-file-code" style="color: var(--neon-blue); margin-left:10px;"></i>
                            <span class="file-name">${file.name}</span>
                        </div>
                        <a href="${file.url}" class="download-btn" target="_blank">
                            <i class="fas fa-download"></i> GET_FILE
                        </a>
                    `;
                    listDiv.appendChild(item);
                });
            }
        } catch (err) {
            listDiv.innerHTML = "<p style='color:red;'>CONNECTION REFUSED: SERVER_ERROR</p>";
        } finally {
            loader.style.display = "none";
        }
    }

    window.onload = fetchFiles;
</script>

</body>
</html>
