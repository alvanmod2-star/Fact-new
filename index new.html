<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Server - مركز الرفع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --google-blue: #4285F4; --bg: #0b0e11; --card: #15191c; --main: #3ecf8e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); padding: 30px; border-radius: 20px; width: 95%; max-width: 450px; text-align: center; border: 1px solid #222; box-shadow: 0 10px 40px rgba(0,0,0,0.6); margin-bottom: 20px; }
        .upload-zone { border: 2px dashed #333; padding: 30px 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; margin: 20px 0; background: rgba(66, 133, 244, 0.05); }
        .upload-zone:hover { border-color: var(--google-blue); background: rgba(66, 133, 244, 0.1); }
        .btn { background: var(--google-blue); border: none; color: white; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .files-list-container { background: var(--card); width: 95%; max-width: 450px; border-radius: 20px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #222; }
        .download-link { background: var(--main); color: black; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: var(--google-blue);"><i class="fab fa-google-drive"></i> Drive Server</h2>
    <div class="upload-zone" onclick="document.getElementById('fileInp').click()">
        <i class="fas fa-cloud-upload-alt" style="font-size: 40px; color: var(--google-blue);"></i>
        <p id="fileName">اضغط هنا لاختيار ملف</p>
        <input type="file" id="fileInp" style="display:none" onchange="updateFileName()">
    </div>
    <button class="btn" id="uploadBtn" style="width:100%" onclick="uploadToDrive()">رفع الملف الآن</button>
    <div id="status">جاهز...</div>
</div>

<div class="files-list-container">
    <h3 style="margin-top:0"><i class="fas fa-list" style="color: var(--main);"></i> الملفات العامة</h3>
    <div id="filesList">جاري التحميل...</div>
</div>

<script>
    // الرابط اللي دزيته إنت
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxCrIsYGVWgPNnY_BXu_XvIvjxCTEZBLUM5O616cfvyuiLGA0fOSUMz6UBf5G22dxg/exec';

    function updateFileName() {
        const file = document.getElementById('fileInp').files[0];
        if (file) document.getElementById('fileName').innerText = file.name;
    }

    async function uploadToDrive() {
        const file = document.getElementById('fileInp').files[0];
        const status = document.getElementById('status');
        if (!file) return alert("اختر ملف أولاً!");

        status.innerText = "جاري الرفع...";
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result.split(',')[1];
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ base64: base64, contentType: file.type, name: file.name })
                });
                const result = await response.json();
                if (result.result === 'success') {
                    status.innerText = "✅ تم الرفع بنجاح!";
                    fetchFiles();
                } else {
                    status.innerText = "❌ فشل: " + result.error;
                }
            } catch (err) { status.innerText = "❌ خطأ في السيرفر"; }
        };
        reader.readAsDataURL(file);
    }

    async function fetchFiles() {
        const listDiv = document.getElementById('filesList');
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            listDiv.innerHTML = "";
            data.forEach(f => {
                listDiv.innerHTML += `<div class="file-item"><span>${f.name}</span><a href="${f.url}" class="download-link" target="_blank">تنزيل</a></div>`;
            });
        } catch (e) { listDiv.innerText = "فشل تحديث القائمة"; }
    }
    window.onload = fetchFiles;
</script>
</body>
</html>
