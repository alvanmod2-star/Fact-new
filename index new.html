<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز تحميل الملفات - Drive Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --google-blue: #4285F4; 
            --bg: #0b0e11; 
            --card: #15191c; 
            --main: #3ecf8e; 
            --text-gray: #9ca3af;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
        }

        .header h1 {
            color: var(--google-blue);
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-gray);
            font-size: 14px;
        }

        .files-container { 
            background: var(--card); 
            width: 95%; 
            max-width: 500px; 
            border-radius: 24px; 
            padding: 25px; 
            border: 1px solid #222; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.7); 
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2d333b;
        }

        .list-header h3 { margin: 0; font-size: 18px; color: var(--main); }

        .refresh-btn {
            background: rgba(66, 133, 244, 0.1);
            border: none;
            color: var(--google-blue);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .refresh-btn:hover { background: var(--google-blue); color: white; transform: rotate(180deg); }

        .file-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px; 
            border-radius: 12px;
            margin-bottom: 10px;
            background: #1c2126;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .file-item:hover { 
            border-color: var(--google-blue);
            transform: scale(1.02);
            background: #212830;
        }

        .file-info { display: flex; align-items: center; gap: 15px; overflow: hidden; }

        .file-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-gray);
            font-size: 18px;
        }

        .file-name { 
            font-weight: 500;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 220px; 
            font-size: 15px;
        }

        .download-btn { 
            background: var(--main); 
            color: #000; 
            text-decoration: none; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 700; 
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .download-btn:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(62, 207, 142, 0.4); }

        #loader {
            text-align: center;
            padding: 40px 0;
            color: var(--text-gray);
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid var(--google-blue);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fab fa-google-drive"></i> سحابة الملفات</h1>
    <p>جميع الملفات المرفوعة في مجلد "تحميل ورفع"</p>
</div>

<div class="files-container">
    <div class="list-header">
        <h3><i class="fas fa-folder-open"></i> قائمة الملفات</h3>
        <button class="refresh-btn" onclick="fetchFiles()" title="تحديث القائمة">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p>جاري جلب الملفات من درايف...</p>
    </div>

    <div id="filesList"></div>
</div>

<script>
    // الرابط الجديد الذي قمت بإنشائه
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyHXuVR-pmri7H4revJk3fGxZmRKzv3l0ziGPT1TRbl8crOJc8VZ5LDIweT1MARolVN/exec';

    async function fetchFiles() {
        const listDiv = document.getElementById('filesList');
        const loader = document.getElementById('loader');
        
        listDiv.style.display = "none";
        loader.style.display = "block";

        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            
            listDiv.innerHTML = "";
            
            if (data.length === 0) {
                listDiv.innerHTML = `
                    <div style="text-align:center; padding:30px; color:#555;">
                        <i class="fas fa-ghost" style="font-size:40px; margin-bottom:10px;"></i>
                        <p>لا توجد ملفات حالياً في المجلد.</p>
                    </div>`;
            } else {
                data.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <div class="file-info">
                            <div class="file-icon"><i class="far fa-file-alt"></i></div>
                            <span class="file-name" title="${file.name}">${file.name}</span>
                        </div>
                        <a href="${file.url}" class="download-btn" target="_blank">
                            <i class="fas fa-download"></i> تحميل
                        </a>
                    `;
                    listDiv.appendChild(item);
                });
            }
        } catch (err) {
            listDiv.innerHTML = `<p style="color:#ff4b4b; text-align:center;">عذراً، فشل الاتصال بالسيرفر.</p>`;
        } finally {
            loader.style.display = "none";
            listDiv.style.display = "block";
        }
    }

    // تشغيل الجلب تلقائياً
    window.onload = fetchFiles;
</script>

</body>
</html>
