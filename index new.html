<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUQTADA ADMIN V1</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { border: 2px solid #0f0; padding: 20px; border-radius: 15px; box-shadow: 0 0 20px #0f0; width: 90%; max-width: 400px; text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #0f0; background: #111; color: #0f0; font-weight: bold; box-sizing: border-box; }
        button { background: #0f0; color: #000; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0a0; box-shadow: 0 0 10px #0f0; }
        .list { width: 90%; max-width: 400px; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
        .key-item { background: #111; padding: 10px; margin: 5px 0; border: 1px solid #222; display: flex; justify-content: space-between; align-items: center; border-radius: 5px; text-align: left; }
        .key-info { display: flex; flex-direction: column; flex-grow: 1; }
        .device-count { color: #ffeb3b; font-size: 0.85em; }
        .btn-delete { background: #ff5252; color: #fff; border: none; width: auto; padding: 5px 10px; margin-left: 5px; }
        .btn-delete:hover { background: #d32f2f; box-shadow: 0 0 10px #ff5252; }
        .btn-copy { background: #00b0ff; color: #fff; border: none; width: auto; padding: 5px 10px; }
        .actions { display: flex; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-shadow: 0 0 10px #0f0;">GENERATE ENCRYPTED KEY</h2>
        <input type="text" id="keyCode" placeholder="أدخل الكود أو ولده">
        <select id="duration">
            <option value="1">ساعة (1 Hour)</option>
            <option value="24">يوم (1 Day)</option>
            <option value="168">أسبوع (1 Week)</option>
            <option value="720">شهر (1 Month)</option>
        </select>
        <button onclick="generateRandom()">توليد كود عشوائي</button>
        <button onclick="saveKey()">تفعيل ورفع أونلاين</button>
    </div>

    <div class="list" id="keyList">
        <p style="text-align:center;">جاري جلب الأكواد...</p>
    </div>

<script>
    const firebaseConfig = {
        databaseURL: "https://maqtadakeynewapp-default-rtdb.firebaseio.com"
    };
    
    try {
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function generateRandom() {
            const key = "MQ-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            document.getElementById('keyCode').value = key;
        }

        function saveKey() {
            const code = document.getElementById('keyCode').value;
            const hours = document.getElementById('duration').value;
            if (!code) return alert("الرجاء توليد كود أولاً!");

            const expiry = Date.now() + (hours * 60 * 60 * 1000);

            db.ref('Keys/' + code).set({
                s: 1001, 
                e: expiry 
            }).then(() => {
                alert("تم الرفع بنجاح: " + code);
                copyText(code);
            }).catch(err => alert("خطأ في الرفع: " + err.message));
        }

        function deleteKey(code) {
            if(confirm("هل أنت متأكد من حذف الكود: " + code + "؟")) {
                db.ref('Keys/' + code).remove()
                .then(() => alert("تم حذف الكود بنجاح"))
                .catch(err => alert("خطأ أثناء الحذف: " + err.message));
            }
        }

        function copyText(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("تم نسخ الكود!");
        }

        db.ref('Keys').on('value', snap => {
            const listDiv = document.getElementById('keyList');
            listDiv.innerHTML = "<h3>الأكواد النشطة:</h3>";
            if (!snap.exists()) {
                listDiv.innerHTML += "<p>لا توجد أكواد حالياً</p>";
                return;
            }
            
            snap.forEach(child => {
                const data = child.val();
                const now = Date.now();
                const remaining = Math.round((data.e - now) / 3600000);
                
                let devicesCount = 0;
                if (data.devices) {
                    devicesCount = Object.keys(data.devices).length;
                }

                if (remaining > 0) {
                    listDiv.innerHTML += `
                        <div class="key-item">
                            <div class="key-info">
                                <span style="color:#0f0; font-weight:bold;">${child.key}</span>
                                <span style="font-size:0.8em;">باقي: ${remaining} ساعة</span>
                                <span class="device-count">الأجهزة: ${devicesCount}</span>
                            </div>
                            <div class="actions">
                                <button class="btn-copy" onclick="copyText('${child.key}')">نسخ</button>
                                <button class="btn-delete" onclick="deleteKey('${child.key}')">حذف</button>
                            </div>
                        </div>`;
                } else {
                    db.ref('Keys/' + child.key).remove();
                }
            });
        });

    } catch (e) {
        document.body.innerHTML = "<h1 style='color:red'>خطأ في الاتصال!</h1>";
    }
</script>
</body>
</html>
